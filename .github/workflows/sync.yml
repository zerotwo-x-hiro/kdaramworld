name: Sync KDramaWorld Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Manual run trigger

jobs:
  sync:
    name: Sync Dramas and Ratings
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Drama Sync
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://kdramaworld.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured. Skipping remote sync."
            exit 0
          fi
          echo "Triggering drama catalog sync..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$SITE_URL/api/cron/sync-dramas" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "$RESPONSE"

      - name: Trigger Ratings Sync
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://kdramaworld.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured. Skipping remote sync."
            exit 0
          fi
          echo "Triggering IMDb ratings sync..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$SITE_URL/api/cron/sync-ratings" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "$RESPONSE"
